<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="당신의 이름으로 시작하는 작은 환영 인사.">
  <title>반가워요 — 당신을 위한 인사</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f6f2;color:#283b32;font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;min-height:100svh;display:flex;flex-direction:column}header{padding:32px 6%;display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-1px}.brand-icon{width:29px;height:29px;border-radius:50%;background:#3e5c48;color:#fff;display:grid;place-items:center;font-size:19px}main{flex:1;display:grid;place-items:center;padding:30px 24px 70px}.card{text-align:center;width:100%;max-width:520px}.illustration{width:140px;height:140px;margin:0 auto 32px;position:relative;display:grid;place-items:center;background:#e9eddf;border-radius:50%}.flower{font-size:83px;line-height:1;transform:rotate(-12deg);color:#667b49}.spark{position:absolute;right:5px;top:12px;font-size:26px;color:#a5af83}.eyebrow{font-size:12px;letter-spacing:3px;color:#7b876f;margin-bottom:17px;font-weight:700}h1{font-size:clamp(34px,6vw,46px);letter-spacing:-2px;line-height:1.35;margin:0 0 18px;font-weight:700;overflow-wrap:anywhere}.description{font-size:16px;line-height:1.8;color:#7b8075;margin:0 0 36px}form{text-align:left;background:#fff;padding:28px;border:1px solid #e7e8df;border-radius:20px;box-shadow:0 12px 40px #34402d05}label{display:block;font-size:14px;font-weight:600;margin-bottom:12px}input{width:100%;border:1px solid #dedfd5;background:#fcfcf9;border-radius:10px;padding:16px;font:inherit;font-size:16px;color:#283b32;outline:none}input::placeholder{color:#a2a699}input:focus{border-color:#58704f;box-shadow:0 0 0 3px #58704f15}button{border:0;border-radius:10px;width:100%;margin-top:14px;padding:17px;background:#3e5c48;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s,transform .2s}button:hover{background:#304a39}button:active{transform:translateY(1px)}button:focus-visible{outline:3px solid #99aa7c;outline-offset:3px}.arrow{margin-left:10px}.note{color:#989d8d;font-size:12px;margin-top:23px;line-height:1.7}footer{text-align:center;color:#9ba08f;font-size:12px;padding:24px;letter-spacing:.2px}.result{animation:appear .4s ease}@keyframes appear{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@media(max-width:480px){header{padding:25px}main{padding-top:16px}form{padding:23px}.illustration{width:120px;height:120px;margin-bottom:26px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <header><span class="brand-icon" aria-hidden="true">✳</span>반가워요</header>
  <main>
    <section class="card" aria-label="환영 인사">
      <div class="illustration" aria-hidden="true"><span class="flower">✿</span><span class="spark">✧</span></div>
      <div class="eyebrow">A LITTLE HELLO FOR YOU</div>
      <div id="greeting" aria-live="polite" aria-atomic="true"><h1>당신을 만나 반가워요.</h1><p class="description">모든 만남은 작은 인사에서 시작되죠.<br>어떤 이름으로 불러드릴까요?</p></div>
      <form id="welcome-form">
        <label for="name">이름</label>
        <input id="name" name="name" placeholder="이름을 입력해주세요" autocomplete="given-name" maxlength="40" required>
        <button type="submit">인사 나누기 <span class="arrow" aria-hidden="true">↗</span></button>
      </form>
      <p class="note">입력한 이름은 저장되지 않아요.<br>편하게 당신의 이름을 알려주세요.</p>
    </section>
  </main>
  <footer>작은 인사, 기분 좋은 시작.</footer>
  <script>
    const form = document.getElementById('welcome-form');
    const input = document.getElementById('name');
    input.addEventListener('input', () => input.setCustomValidity(''));
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) { input.setCustomValidity('이름을 입력해주세요.'); input.reportValidity(); return; }
      const title = document.createElement('h1');
      title.append(document.createTextNode(name + ' 님,'), document.createElement('br'), document.createTextNode('어서오세요!'));
      const description = document.createElement('p');
      description.className = 'description';
      description.textContent = '함께해서 반가워요. 오늘도 좋은 하루 보내세요.';
      const greeting = document.getElementById('greeting');
      greeting.replaceChildren(title, description);
      greeting.classList.remove('result');
      void greeting.offsetWidth;
      greeting.classList.add('result');
      form.querySelector('button').firstChild.textContent = '다시 인사하기 ';
    });
  </script>
</body>
</html>
