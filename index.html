<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="이름을 입력하고 나만의 따뜻한 환영 인사를 만나보세요.">
  <title>어서오세요 | 반가운 첫인사</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header><a class="brand" href="./"><span class="brand-mark" aria-hidden="true">✳</span> hello.</a><span class="header-note">반가운 만남의 시작</span></header>
  <main>
    <section class="welcome-card" aria-labelledby="title">
      <div class="hello-icon" aria-hidden="true">✳</div>
      <p class="eyebrow">A LITTLE HELLO, JUST FOR YOU</p>
      <h1 id="title">만나서 반가워요<span>.</span></h1>
      <p class="description">어떤 이름으로 불러드릴까요?<br>이름을 알려주시면, 반갑게 맞이할게요.</p>
      <form id="welcome-form">
        <label for="name">이름</label>
        <input id="name" name="name" type="text" placeholder="이름을 입력해주세요" autocomplete="given-name" maxlength="50" required aria-describedby="name-error">
        <p id="name-error" class="error" hidden>이름을 입력해주세요.</p>
        <button type="submit">인사 나누기 <span aria-hidden="true">→</span></button>
      </form>
      <div id="greeting" class="greeting" role="status" aria-live="polite" aria-atomic="true"><span class="small-star" aria-hidden="true">✧</span><p id="greeting-text">당신을 위한 인사가 기다리고 있어요.</p></div>
    </section>
    <p class="bottom-note"><span aria-hidden="true">☀</span> 작은 인사로 시작하는 기분 좋은 하루</p>
  </main>
  <footer><span>MADE TO MAKE YOU SMILE</span><span>좋은 하루 보내세요.</span></footer>
</body>
</html>
