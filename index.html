<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="당신의 이름으로 전하는 따뜻한 환영 인사">
  <title>반가워요 — 당신을 위한 환영 인사</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; background: #f8f7f3; color: #263b32; font-family: "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; display: flex; flex-direction: column; }
    header { padding: 30px 6%; display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 700; }
    .brand-icon { color: #63876b; font-size: 27px; }
    main { flex: 1; display: grid; place-items: center; padding: 38px 24px 80px; }
    .card { width: 100%; max-width: 530px; text-align: center; }
    .flower { width: 94px; height: 94px; margin: 0 auto 30px; background: #e9eee3; border-radius: 50%; display: grid; place-items: center; }
    .eyebrow { color: #718172; font-size: 12px; font-weight: 700; letter-spacing: 3px; margin: 0 0 18px; }
    h1 { font-size: clamp(34px, 7vw, 48px); letter-spacing: -2px; line-height: 1.3; margin: 0 0 18px; font-weight: 700; }
    .intro { color: #7a8179; font-size: 16px; line-height: 1.8; margin: 0 0 40px; }
    form { text-align: left; background: #fff; border: 1px solid #e9e9e0; border-radius: 20px; padding: 28px; box-shadow: 0 10px 40px #263b3205; }
    label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 12px; }
    input { width: 100%; font: inherit; font-size: 16px; border: 1px solid #dfe3da; background: #fcfcfa; padding: 16px; border-radius: 10px; color: #263b32; outline: none; }
    input::placeholder { color: #a6aca2; }
    input:focus { border-color: #63876b; box-shadow: 0 0 0 3px #63876b18; }
    button { width: 100%; margin-top: 14px; border: none; border-radius: 10px; padding: 17px; font: inherit; font-weight: 600; background: #42664d; color: white; cursor: pointer; transition: background .2s, transform .2s; }
    button:hover { background: #33543d; transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid #a3bb95; outline-offset: 3px; }
    button span { margin-left: 12px; }
    .note { font-size: 12px; color: #90988b; margin: 22px 0 0; }
    #greeting { font-size: 23px; line-height: 1.6; overflow-wrap: anywhere; color: #42664d; margin: 26px 0 0; }
    #greeting:empty { display: none; }
    footer { text-align: center; padding: 24px; border-top: 1px solid #e8e9df; color: #969c91; font-size: 12px; }
    @media (max-width: 480px) { header { padding: 24px; } main { padding-top: 30px; } form { padding: 23px; } }
    @media (prefers-reduced-motion: reduce) { button { transition: none; } }
  </style>
</head>
<body>
  <header><span class="brand-icon" aria-hidden="true">✳</span> 반가워요</header>
  <main>
    <section class="card" aria-labelledby="title">
      <div class="flower" aria-hidden="true"><svg width="58" height="58" viewBox="0 0 64 64" fill="none"><path d="M32 51V32" stroke="#577b56" stroke-width="3" stroke-linecap="round"/><path d="M32 44C20 44 17 36 17 36C27 34 32 39 32 44ZM33 39C44 40 48 32 48 32C38 30 33 35 33 39Z" fill="#78936b"/><path d="M32 13C24 1 13 13 21 22C8 25 14 39 25 33C29 46 43 40 39 30C53 27 48 13 38 18C38 8 31 7 32 13Z" fill="#e4be6d"/><circle cx="31" cy="25" r="6" fill="#f8f7f3"/></svg></div>
      <p class="eyebrow">A LITTLE HELLO</p>
      <h1 id="title">당신을 만나 반가워요.</h1>
      <p class="intro">이름을 알려주세요.<br>당신을 위한 작은 환영 인사를 준비했어요.</p>
      <form id="welcome-form">
        <label for="name">어떻게 불러드릴까요?</label>
        <input id="name" name="name" type="text" placeholder="이름을 입력해주세요" autocomplete="given-name" maxlength="50" required>
        <button type="submit">환영 인사 받기 <span aria-hidden="true">→</span></button>
      </form>
      <p id="greeting" role="status" aria-live="polite"></p>
      <p class="note">입력한 이름은 저장되지 않아요.</p>
    </section>
  </main>
  <footer>작은 인사로 시작하는 좋은 하루.</footer>
  <script>
    const form = document.querySelector('#welcome-form');
    const input = document.querySelector('#name');
    const greeting = document.querySelector('#greeting');
    input.addEventListener('input', () => input.setCustomValidity(''));
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const name = input.value.trim();
      if (!name) {
        input.setCustomValidity('이름을 입력해주세요.');
        input.reportValidity();
        return;
      }
      input.setCustomValidity('');
      greeting.textContent = `${name} 님 어서오세요`;
    });
  </script>
</body>
</html>
